name: Build Android APK

on:
  push:
    branches: [main, master]
    # the app commits orders/** to this repo (GitHub storage); that must never trigger a build
    paths-ignore:
      - "orders/**"
      - "config/**"
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [both, debug, release]
        default: both

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.ver.outputs.name }}
      artifact: OrderNotebook-apk-${{ steps.ver.outputs.name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Telegram notifier (Python, standard library only)
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          # The runner image ships the Android SDK; accept licenses and install what we compile against.
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle (install dependencies, cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compute version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME (code ${GITHUB_RUN_NUMBER})"

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }}

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }}

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }}

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/OrderNotebook-${{ steps.ver.outputs.name }}.apk" 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk "dist/OrderNotebook-${{ steps.ver.outputs.name }}-debug.apk" 2>/dev/null || true
          ls -la dist

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrderNotebook-apk-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload test and build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/test-results

  # Runs only if the build job (incl. tests) succeeded, so a failed build never publishes a Release.
  release:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Locate release APK
        id: apk
        run: |
          # The release APK is the one without "-debug" in its name (see "Collect APKs" in the build job).
          APK="$(ls dist/*.apk | grep -v -- '-debug.apk' | head -1 || true)"
          if [ -z "$APK" ]; then
            echo "::notice::No release APK in this run (debug-only build) - skipping Release."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$APK" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.apk.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::warning::Release $TAG already exists - not creating a duplicate."
            exit 0
          fi
          gh release create "$TAG" "$APK" \
            --target "${{ github.sha }}" \
            --title "Order Notebook ${VERSION}" \
            --generate-notes

  # Publishes the same signed APK to the PUBLIC store-releases repo and registers/refreshes it in Kavir Store.
  # No customer data is involved: only the APK and a fixed catalog entry leave this private repo.
  publish-store:
    needs: [build, release]
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      STORE_REPO: ${{ vars.KAVIR_STORE_REPO || 'kavirkobra19/KavirStore' }}
      APP_REPO: ${{ vars.KAVIR_STORE_APP_REPO || 'kavirkobra19/OrderNotebook-Releases' }}
      KAVIR_STORE_TOKEN: ${{ secrets.KAVIR_STORE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check store token
        id: tok
        run: |
          if [ -z "$KAVIR_STORE_TOKEN" ]; then
            echo "::warning::Secret KAVIR_STORE_TOKEN is not set - skipping Kavir Store publishing."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download build artifact
        if: steps.tok.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      - name: Publish APK to the public releases repo
        if: steps.tok.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.KAVIR_STORE_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          PRIV=$(gh api "repos/$APP_REPO" -q .private)
          if [ "$PRIV" != "false" ]; then echo "::error::$APP_REPO must be a PUBLIC repository"; exit 1; fi
          APK="$(ls dist/*.apk | grep -v -- '-debug.apk' | head -1)"
          [ -n "$APK" ] || { echo "::error::no release APK"; exit 1; }
          TAG="v${VERSION}"
          # plain notes on purpose: auto-generated notes would expose private commit titles
          NOTES="Order Notebook ${VERSION}"
          if gh release view "$TAG" -R "$APP_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" -R "$APP_REPO" --clobber
          else
            gh release create "$TAG" "$APK" -R "$APP_REPO" --title "Order Notebook ${VERSION}" --notes "$NOTES"
          fi
      - name: Register / refresh in Kavir Store
        if: steps.tok.outputs.ok == 'true'
        working-directory: .github/scripts
        run: python3 -m unittest test_register_in_store && python3 register_in_store.py
