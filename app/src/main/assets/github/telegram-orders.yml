name: Telegram Orders

# Sends / edits the Telegram message, order image and photos of every order stored in Order/orders/.
# Needs two repository secrets:  TELEGRAM_BOT_TOKEN  and  TELEGRAM_CHAT_ID  (the app creates them for you)
# (Settings -> Secrets and variables -> Actions -> New repository secret)

on:
  push:
    branches: [main, master]
    paths:
      - "Order/orders/**"
      - "config/notify.json"
  schedule:
    - cron: "17 * * * *" # hourly retry of anything that failed earlier (no-op when everything is delivered)
  workflow_dispatch:
    inputs:
      test:
        description: "Only send a test message"
        type: boolean
        default: false
      resend:
        description: "Order number to send again as a NEW message (empty = normal run)"
        type: string
        default: ""

# one run at a time, queued runs wait (never cancel a run that is sending)
concurrency:
  group: telegram-notify
  cancel-in-progress: false

permissions:
  contents: write # commits Order/orders/<n>/telegram.json (delivery state) with the built-in GITHUB_TOKEN

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python (standard library only, no dependencies to install)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIT_COMMIT_STATE: "1"
          RESEND: ${{ inputs.resend }}
          TEST: ${{ inputs.test }}
        run: |
          args=""
          if [ "$TEST" = "true" ]; then args="--test"; fi
          if [ -n "$RESEND" ]; then args="--resend $RESEND"; fi
          python .github/scripts/telegram_notify.py $args
